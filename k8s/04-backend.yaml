apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medicitas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Imagen construida localmente: docker build -t medicitas-backend:latest ./backend
          image: medicitas-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: medicitas-config
            - secretRef:
                name: medicitas-secrets
          # El API responde 401 sin token, por eso la sonda es TCP y no HTTP
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medicitas
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
