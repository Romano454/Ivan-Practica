apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: medicitas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Imagen construida localmente: docker build -t medicitas-frontend:latest ./frontend
          image: medicitas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # nginx dentro del contenedor hace proxy de /api al Service "backend"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: medicitas
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
